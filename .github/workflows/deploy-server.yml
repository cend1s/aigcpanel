name: Deploy Server

# 服务端自动部署：打包 linux-x64 服务端（含管理后台与 Node），上传到服务器并用 systemd 运行。
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   SERVER_HOST               服务器公网 IP 或域名（必填，未配置时跳过部署）
#   SERVER_PASSWORD           root 密码；或改用 SERVER_SSH_KEY（私钥，推荐）
#   SERVER_HOST_FINGERPRINT   主机公钥指纹，如 SHA256:xxxx（推荐，防止中间人）
#   ADMIN_EMAIL / ADMIN_PASSWORD   可选，部署时确保该管理员存在
# 服务器上的配置与数据见 backend/packaging/deploy/remote-install.sh。
on:
  workflow_dispatch:
  push:
    branches:
      - claude/nifty-rubin-ix03iu
    paths:
      - backend/**
      - admin/**
      - .github/workflows/deploy-server.yml

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend tests
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Pack server bundle
        run: |
          export BUILD_VERSION="r${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          node backend/packaging/pack.mjs --platform linux-x64 --out dist-server
          cd dist-server
          tar -czf bundle.tgz aigcpanel-server-linux-x64

      - name: Deploy to server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_FINGERPRINT: ${{ secrets.SERVER_HOST_FINGERPRINT }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PUBLIC_URL: ${{ vars.SERVER_URL }}
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "::warning::未配置 SERVER_HOST，跳过部署"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$SERVER_HOST_FINGERPRINT" ]; then
            actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
            if [ "$actual" != "$SERVER_HOST_FINGERPRINT" ]; then
              echo "::error::主机指纹不匹配：$actual"
              exit 1
            fi
          else
            echo "::warning::未配置 SERVER_HOST_FINGERPRINT，未校验服务器身份"
          fi
          if [ -n "$SERVER_SSH_KEY" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
            SSH="ssh -i $HOME/.ssh/id_deploy"; SCP="scp -i $HOME/.ssh/id_deploy"
          elif [ -n "$SSHPASS" ]; then
            sudo apt-get install -y -qq sshpass >/dev/null
            SSH="sshpass -e ssh"; SCP="sshpass -e scp"
          else
            echo "::error::未配置 SERVER_PASSWORD 或 SERVER_SSH_KEY"
            exit 1
          fi
          OPTS="-o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15"
          # 敏感配置写入临时文件上传，执行后由脚本删除，不出现在命令行里
          umask 077
          {
            printf 'ADMIN_EMAIL=%q\n' "$ADMIN_EMAIL"
            printf 'ADMIN_PASSWORD=%q\n' "$ADMIN_PASSWORD"
            printf 'PUBLIC_URL=%q\n' "${PUBLIC_URL:-http://$SERVER_HOST:3100}"
          } > deploy-secrets.env
          $SCP $OPTS dist-server/bundle.tgz backend/packaging/deploy/remote-install.sh deploy-secrets.env "$SERVER_USER@$SERVER_HOST:/tmp/"
          $SSH $OPTS "$SERVER_USER@$SERVER_HOST" "bash /tmp/remote-install.sh /tmp/bundle.tgz /tmp/deploy-secrets.env; rc=\$?; rm -f /tmp/remote-install.sh; exit \$rc"
